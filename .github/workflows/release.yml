name: Release

# Собирает universal .app (arm64 + x86_64) и публикует GitHub Release по
# тегу v*. Релиз никогда не публикуется без успешных тестов. При наличии
# Developer ID секретов — подписывает, нотаризует и делает staple; при их
# отсутствии — публикует ad-hoc-подписанный zip с предупреждением про
# Gatekeeper (см. секрет-preflight ниже).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Secrets preflight
        id: secrets-preflight
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MACOS_CERT_P12_BASE64" ]] || missing+=("MACOS_CERT_P12_BASE64")
          [[ -n "$MACOS_CERT_PASSWORD" ]] || missing+=("MACOS_CERT_PASSWORD")
          [[ -n "$DEVELOPER_ID_APPLICATION" ]] || missing+=("DEVELOPER_ID_APPLICATION")

          # Все три секрета отсутствуют — Developer ID не настроен, публикуем
          # ad-hoc-подписанный zip вместо fail-closed abort.
          if [[ ${#missing[@]} -eq 3 ]]; then
            echo "No Developer ID secrets configured — building ad-hoc-signed release zip instead of sign+notarize."
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Частичный набор секретов — это неверная конфигурация, а не
          # осознанное отсутствие подписи, поэтому остаёмся fail-closed.
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "FAIL-CLOSED: partial Developer ID secrets configured, missing: ${missing[*]}" >&2
            exit 1
          fi

          api_key_ok=0
          if [[ -n "$NOTARY_KEY" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER" ]]; then
            api_key_ok=1
          elif [[ -n "$NOTARY_KEY" || -n "$NOTARY_KEY_ID" || -n "$NOTARY_ISSUER" ]]; then
            echo "FAIL-CLOSED: notary auth incomplete (API key): NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER must all be set" >&2
            exit 1
          fi

          apple_id_ok=0
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            apple_id_ok=1
          elif [[ -n "$APPLE_ID" || -n "$APPLE_APP_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
            echo "FAIL-CLOSED: notary auth incomplete (Apple ID): APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID must all be set" >&2
            exit 1
          fi

          if [[ $((api_key_ok + apple_id_ok)) -eq 0 ]]; then
            echo "FAIL-CLOSED: exactly one notary auth method is required (API key or Apple ID)" >&2
            exit 1
          fi

          if [[ $((api_key_ok + apple_id_ok)) -gt 1 ]]; then
            echo "FAIL-CLOSED: conflicting notary auth methods: use either API key or Apple ID, not both" >&2
            exit 1
          fi

          echo "secrets_present=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build universal binary
        # --product: иначе VerifyCli (main.swift + @main) ломает multi-arch сборку.
        run: swift build -c release --product MacLimitsTracker --arch arm64 --arch x86_64

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}" BIN_SRC="$PWD/.build/apple/Products/Release/MacLimitsTracker" ./make-app.sh
          lipo -info dist/MacLimitsTracker.app/Contents/MacOS/MacLimitsTracker

      - name: Import signing certificate
        if: steps.secrets-preflight.outputs.secrets_present == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          RUNNER_KEYCHAIN_PW="$(openssl rand -base64 32)"
          readonly RUNNER_KEYCHAIN_PW

          security create-keychain -p "$RUNNER_KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_KEYCHAIN_PW" build.keychain

          CERT_P12="$(mktemp -t cert.XXXXXX.p12)"
          base64 -D -o "$CERT_P12" <<<"$MACOS_CERT_P12_BASE64"
          security import "$CERT_P12" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -k build.keychain
          rm -f "$CERT_P12"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,security: -k "$RUNNER_KEYCHAIN_PW" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          security find-identity -v -p codesigning

      - name: Sign, notarize and staple
        if: steps.secrets-preflight.outputs.secrets_present == 'true'
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/release/sign-and-notarize.sh --app dist/MacLimitsTracker.app --out dist

      - name: Build ad-hoc release zip
        # Developer ID не настроен — публикуем zip из ad-hoc-подписанного
        # бандла (подпись линкера, см. make-app.sh) вместо sign+notarize.
        if: steps.secrets-preflight.outputs.secrets_present == 'false'
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent dist/MacLimitsTracker.app dist/MacLimitsTracker.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRETS_PRESENT: ${{ steps.secrets-preflight.outputs.secrets_present }}
        # Релиз мог быть создан вручную до пуша тега — тогда не падаем
        # на duplicate, а просто докладываем ассет в существующий релиз.
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          notes_file=""
          if [[ "$SECRETS_PRESENT" == "false" ]]; then
            notes_file="$(mktemp -t release-notes.XXXXXX.md)"
            cat > "$notes_file" <<'EOF'
          ⚠️ **Unsigned build (ad-hoc signature)**

          Developer ID секрет не настроен, поэтому этот релиз собран без
          подписи и нотаризации. При первом запуске Gatekeeper покажет
          предупреждение "unidentified developer".

          Как запустить:
          1. Распакуйте архив и перенесите `MacLimitsTracker.app` в `/Applications`.
          2. Снимите карантин: `xattr -cr /Applications/MacLimitsTracker.app`
             — либо откройте приложение через правый клик → «Открыть» вместо двойного клика.
          EOF
            notes_args=(--notes-file "$notes_file")
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/MacLimitsTracker.zip --clobber
            if [[ -n "$notes_file" ]]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/MacLimitsTracker.zip "${notes_args[@]}" --title "$GITHUB_REF_NAME"
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
